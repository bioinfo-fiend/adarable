<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="t d">
  <title id="t">ADARable</title>
  <desc id="d">A smiling coral ADAR enzyme blob next to the ADARable wordmark and an RNA strand where an A is edited to I.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#11192e"/>
    </linearGradient>
    <radialGradient id="body" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff9a8b"/>
      <stop offset="1" stop-color="#f25f5c"/>
    </radialGradient>
  </defs>

  <rect width="640" height="220" rx="28" fill="url(#bg)"/>

  <!-- RNA strand under the mascot and wordmark -->
  <path d="M30 186 Q 90 168 150 186 T 270 186 T 390 186 T 510 186 T 620 180" fill="none" stroke="#3d5a80" stroke-width="5" stroke-linecap="round"/>
  <g font-family="'Nunito','Trebuchet MS',Verdana,sans-serif" font-weight="800" font-size="15" text-anchor="middle">
    <g fill="#98c1d9">
      <circle cx="270" cy="186" r="13" fill="#24365c"/><text x="270" y="191">U</text>
      <circle cx="330" cy="196" r="13" fill="#24365c"/><text x="330" y="201">C</text>
      <circle cx="450" cy="176" r="13" fill="#24365c"/><text x="450" y="181">G</text>
      <circle cx="510" cy="186" r="13" fill="#24365c"/><text x="510" y="191">U</text>
      <circle cx="570" cy="182" r="13" fill="#24365c"/><text x="570" y="187">A</text>
    </g>
    <!-- the edited base: A -> I -->
    <circle cx="390" cy="186" r="15" fill="#ffd166"/>
    <text x="390" y="192" fill="#11192e" font-size="18">I</text>
    <text x="390" y="160" fill="#ffd166" font-size="12" font-weight="700">A → I</text>
    <path d="M412 164 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z" fill="#ffd166"/>
    <path d="M364 170 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 z" fill="#ffd166" opacity="0.8"/>
  </g>

  <!-- ADAR mascot -->
  <g transform="translate(120 104)">
    <ellipse cx="0" cy="78" rx="62" ry="9" fill="#0b1222" opacity="0.6"/>
    <path d="M-66 20 C -72 -40 -30 -76 4 -74 C 44 -72 74 -38 68 14 C 64 56 34 74 0 74 C -36 74 -62 56 -66 20 Z" fill="url(#body)"/>
    <!-- antenna -->
    <path d="M6 -73 Q 12 -90 26 -90" fill="none" stroke="#f25f5c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="28" cy="-90" r="7" fill="#ffd166"/>
    <!-- eyes -->
    <ellipse cx="-22" cy="-6" rx="14" ry="17" fill="#fff"/>
    <ellipse cx="24" cy="-6" rx="14" ry="17" fill="#fff"/>
    <circle cx="-18" cy="-2" r="8" fill="#11192e"/>
    <circle cx="28" cy="-2" r="8" fill="#11192e"/>
    <circle cx="-15" cy="-6" r="3" fill="#fff"/>
    <circle cx="31" cy="-6" r="3" fill="#fff"/>
    <!-- blush + smile -->
    <ellipse cx="-42" cy="22" rx="10" ry="6" fill="#ff8fa3" opacity="0.8"/>
    <ellipse cx="46" cy="22" rx="10" ry="6" fill="#ff8fa3" opacity="0.8"/>
    <path d="M-10 24 Q 3 38 16 24" fill="none" stroke="#11192e" stroke-width="4" stroke-linecap="round"/>
    <!-- little arm reaching toward the edited base -->
    <path d="M62 30 Q 92 40 104 62" fill="none" stroke="#f25f5c" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Nunito','Trebuchet MS',Verdana,sans-serif" font-weight="900">
    <text x="232" y="108" font-size="70" fill="#f25f5c" letter-spacing="-1">ADAR<tspan fill="#fdf0d5">able</tspan></text>
    <text x="236" y="138" font-size="17" font-weight="700" fill="#98c1d9">A-to-I RNA editing, the adorable way</text>
  </g>
</svg>
